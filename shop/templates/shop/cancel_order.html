<!DOCTYPE html>
<html>
<head>
    <title>Cancel Order</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        h1 {
            color: #dc3545;
        }

        .order-info {
            margin: 20px 0;
            line-height: 1.8;
        }

        button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #b02a37;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            padding: 12px 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚠️ Cancel Order</h1>

    <p>Una uhakika unataka kughairi order hii?</p>

    <div class="order-info">

        <strong>Product:</strong>
        {{ order.product.name }}
        <br>

        <strong>Size:</strong>
        {{ order.size.name }}
        <br>

        <strong>Quantity:</strong>
        {{ order.quantity }}
        <br>

        <strong>Total:</strong>
        {{ order.total_price }} TZS

    </div>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Yes, Cancel Order
        </button>

        <a href="/" class="back">
            No, Go Back
        </a>

    </form>

</div>

</body>
</html>
